# The integration suite against a Spark other than the one Latu targets. Newer: red is upstream
# news. Older: red is expected, and the failures are what docs/spark-versions.md reports. On
# demand, never on a PR. The run summary carries the failing tests and the golden diffs, and the
# same text is in each summary step's log, which is what `gh run view --log` can reach. Why
# there is no cron and why the goldens only report: docs/decisions.md.
name: Spark versions

on:
  workflow_dispatch:
    inputs:
      versions:
        description: JSON array of apache/spark image tags
        default: '["4.2.0"]'

permissions:
  contents: read

jobs:
  matrix:
    name: Spark ${{ matrix.spark }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        spark: ${{ fromJSON(inputs.versions) }}
    env:
      SPARK_VERSION: ${{ matrix.spark }}
    steps:
      - uses: actions/checkout@v7

      - run: docker compose up -d

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - run: mix local.hex --force && mix local.rebar --force
      - run: mix deps.get --check-locked
      - run: python3 -m venv dev/.venv && dev/.venv/bin/pip install -q -r dev/requirements.txt
      - run: mix fixtures
      - run: docker compose up -d --wait

      # Everything but the goldens asserts: a crash or a semantic break on a newer server is a
      # real failure. The goldens are rendering, which a new Spark is allowed to change. The log
      # is kept for the summary below: GitHub shows at most ten failure annotations per step.
      - run: mix test --include integration 2>&1 | tee test.log
        shell: bash

      # Still runs when the suite above is red, which on an older server it always is.
      - name: Result goldens
        if: always()
        run: LATU_GOLDEN=report mix test --include golden

      - name: Failing tests
        if: always()
        run: |
          {
            echo "## Integration suite on Spark ${{ matrix.spark }}"
            echo
            grep -E '^[0-9]+ tests?, ' test.log || echo "No summary line: the suite did not finish."
            echo
            if grep -qE '^\s+[0-9]+\) test ' test.log; then
              echo '```'
              grep -A3 -E '^\s+[0-9]+\) test ' test.log
              echo '```'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Golden diff
        if: always()
        run: |
          {
            echo "## Result goldens on Spark ${{ matrix.spark }}"
            echo
            changed=0
            for actual in test/sql/*.actual; do
              [ -e "$actual" ] || continue
              name=$(basename "$actual" .actual)
              if ! diff -q "test/sql/$name.answer" "$actual" >/dev/null 2>&1; then
                changed=1
                printf '<details><summary><code>%s</code></summary>\n\n```diff\n' "$name"
                diff -u "test/sql/$name.answer" "$actual" || true
                printf '```\n\n</details>\n\n'
              fi
            done
            if [ "$changed" -eq 0 ]; then
              echo "Identical to the committed goldens."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Spark logs
        if: failure()
        run: docker compose logs --no-color --tail=200
