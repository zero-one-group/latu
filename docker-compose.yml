# SPARK_VERSION overrides the tag both servers run, which is how the forward-compatibility
# run in .github/workflows/spark-versions.yml points them at a newer Spark. dev/README.md.
services:
  spark-connect:
    image: apache/spark:${SPARK_VERSION:-4.2.0}
    container_name: latu-spark-connect
    ports:
      - "15002:15002"
      - "4040:4040"
    entrypoint: ["/opt/spark/sbin/start-connect-server.sh"]
    command:
      - "--wait"
      # One task slot: the suite is hundreds of tiny queries, and ten tasks each cost more than
      # they save. Measured; docs/decisions.md "keep whole-stage codegen and local[1]".
      - "--master"
      - "local[1]"
      - "--conf"
      - "spark.connect.grpc.binding.address=0.0.0.0"
      - "--conf"
      - "spark.connect.grpc.binding.port=15002"
      - "--conf"
      - "spark.sql.session.timeZone=UTC"
      - "--conf"
      - "spark.sql.shuffle.partitions=4"
      # A reliable checkpoint needs a directory, and it is a SparkContext-level setting: the
      # command carries no path, so `Latu.checkpoint/2` without `local: true` fails outright
      # unless this is set at startup. (`spark.checkpoint.dir` since Spark 4.0; before that it
      # was SparkContext.setCheckpointDir only, which Spark Connect cannot reach.)
      - "--conf"
      - "spark.checkpoint.dir=/tmp/latu_checkpoints"
      # Progress messages are sent on a timer, default 2s, so a query shorter than that reports
      # nothing at all. 100ms lets `test/integration/progress_test.exs` measure the plumbing
      # without holding local[1]'s single task slot for seconds. A conf change here needs
      # `docker compose up -d --force-recreate spark-connect`.
      - "--conf"
      - "spark.connect.progress.reportInterval=100ms"
      - "--conf"
      - "spark.ui.port=4040"
    # `docker compose up -d --wait` returns when this passes. Without it "up" means the JVM
    # exists, not that the gRPC port is listening, and the first test connects into nothing.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/15002"]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 15s
    volumes:
      - ./fixtures:/fixtures:ro

  spark-reattach:
    image: apache/spark:${SPARK_VERSION:-4.2.0}
    container_name: latu-spark-reattach
    ports:
      - "15003:15002"
      - "4041:4040"
    entrypoint: ["/opt/spark/sbin/start-connect-server.sh"]
    command:
      - "--wait"
      - "--conf"
      - "spark.connect.grpc.binding.address=0.0.0.0"
      - "--conf"
      - "spark.connect.grpc.binding.port=15002"
      - "--conf"
      - "spark.connect.execute.reattachable.senderMaxStreamDuration=5s"
      - "--conf"
      - "spark.connect.execute.reattachable.senderMaxStreamSize=1m"
      - "--conf"
      - "spark.connect.execute.reattachable.observerRetryBufferSize=10m"
      - "--conf"
      - "spark.sql.session.timeZone=UTC"
      - "--conf"
      - "spark.sql.shuffle.partitions=4"
      - "--conf"
      - "spark.ui.port=4040"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/15002"]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 15s
    volumes:
      - ./fixtures:/fixtures:ro

  # The S3 stack, behind `--profile s3`: it pulls two more images and several hundred
  # megabytes of jars, so a bare `up -d` must not start it. dev/README.md.
  minio:
    profiles: ["s3"]
    # MinIO stopped publishing free images in October 2025; this is the last one.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: latu-minio
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: latu
      MINIO_ROOT_PASSWORD: latu-secret-key
    ports:
      - "9000:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 5s

  # Creates the bucket and exits. `service_completed_successfully` below is what makes the
  # Spark server wait for it.
  minio-init:
    profiles: ["s3"]
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: latu-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - mc alias set s3 http://minio:9000 latu latu-secret-key &&
        mc mb --ignore-existing s3/latu
    restart: "no"

  spark-s3:
    profiles: ["s3"]
    image: apache/spark:${SPARK_VERSION:-4.2.0}
    container_name: latu-spark-s3
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "15004:15002"
      - "4042:4040"
    entrypoint: ["/opt/spark/sbin/start-connect-server.sh"]
    command:
      - "--wait"
      # The Connect server ships in the assembly; the S3A filesystem does not. The version
      # tracks the image's own hadoop-client-api, so it moves with SPARK_VERSION and not on
      # its own — docs/guides/object-storage.md.
      - "--packages"
      - "org.apache.hadoop:hadoop-aws:${HADOOP_AWS_VERSION:-3.5.0}"
      # Ivy resolves into $HOME, which is /nonexistent in this image, so it is redirected
      # into the cached volume below — dev/README.md.
      - "--conf"
      - "spark.jars.ivy=/opt/spark/work-dir/.ivy2"
      - "--conf"
      - "spark.connect.grpc.binding.address=0.0.0.0"
      - "--conf"
      - "spark.connect.grpc.binding.port=15002"
      - "--conf"
      - "spark.sql.session.timeZone=UTC"
      - "--conf"
      - "spark.sql.shuffle.partitions=4"
      - "--conf"
      - "spark.ui.port=4040"
    volumes:
      # On work-dir because a fresh named volume inherits the ownership of the image
      # directory it covers, and that is the only one uid 185 owns — dev/README.md.
      - ivy-cache:/opt/spark/work-dir
    # No s3a settings here on purpose: the guide sets all of them from the client, which is
    # what a cluster you cannot restart forces you to do anyway.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/15002"]
      interval: 5s
      timeout: 3s
      # A cold `--packages` pulls the AWS SDK bundle. Minutes, once per ivy-cache volume.
      retries: 90
      start_period: 30s

volumes:
  minio-data:
  ivy-cache:
